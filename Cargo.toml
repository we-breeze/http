[package]
name = "brz-http"
version = "0.0.6"
edition = "2024"
rust-version = "1.85"
description = "Efficient pooled async HTTP client for Breeze services"
license = "MIT OR Apache-2.0"
repository = "https://github.com/we-breeze/http"

[workspace]
members = []
resolver = "3"

[dependencies]
bytes = "1"
http-types = { package = "http", version = "1" }
reqwest = { version = "0.12.28", default-features = false, features = ["http2", "rustls-tls"] }
serde = "1"
brz-metrics = { package = "brz-metrics", version = "=0.0.6", optional = true }
tracing = { version = "0.1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[features]
default = []
metrics = ["dep:brz-metrics"]
json = ["reqwest/json"]
gzip = ["reqwest/gzip"]
brotli = ["reqwest/brotli"]
deflate = ["reqwest/deflate"]
slow-log = ["dep:tracing"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[lib]
name = "brz_http"
